[workspace]

[package]
name = "magnetar-component-kev"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kev decision model component for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-component-Kev"
readme = "README.md"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
